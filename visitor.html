<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Data Pengunjung | ORVANA</title>

    <link
    rel="stylesheet"
    href="visitor.css?v=2"
>
    >

</head>


<body>

    <div class="visitor-page">


        <div class="visitor-decoration decoration-one"></div>

        <div class="visitor-decoration decoration-two"></div>


        <div class="visitor-card">


            <div class="visitor-logo">

                <img
                    src="logo.png"
                    alt="Logo ORVANA"
                >

            </div>


            <h1>
                Selamat Datang di ORVANA
            </h1>


            <p class="visitor-subtitle">

                Silakan isi data diri untuk
                melanjutkan ke website ORVANA.

            </p>


            <form id="visitorForm">


                <!-- NAMA -->

                <div class="form-group">

                    <label for="visitorName">
                        Nama Lengkap
                    </label>

                    <input
                        type="text"
                        id="visitorName"
                        placeholder="Masukkan nama lengkap"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- GMAIL -->

                <div class="form-group">

                    <label for="visitorEmail">
                        Gmail
                    </label>

                    <input
                        type="email"
                        id="visitorEmail"
                        placeholder="contoh@gmail.com"
                        autocomplete="email"
                        required
                    >

                    <small>
                        Kode verifikasi akan dikirim
                        ke Gmail ini.
                    </small>

                </div>


                <!-- ASAL -->

                <div class="form-group">

                    <label for="visitorOrigin">
                        Asal Sekolah / Instansi
                    </label>

                    <input
                        type="text"
                        id="visitorOrigin"
                        placeholder="Masukkan sekolah / instansi"
                        required
                    >

                </div>


                <!-- TUJUAN -->

                <div class="form-group">

                    <label for="visitorPurpose">
                        Tujuan Kunjungan
                    </label>

                    <select
                        id="visitorPurpose"
                        required
                    >

                        <option value="">
                            Pilih tujuan kunjungan
                        </option>

                        <option value="Mengenal anggota ORVANA">
                            Mengenal anggota ORVANA
                        </option>

                        <option value="Melihat informasi perusahaan">
                            Melihat informasi perusahaan
                        </option>

                        <option value="Mencari informasi">
                            Mencari informasi
                        </option>

                        <option value="Lainnya">
                            Lainnya
                        </option>

                    </select>

                </div>


                <!-- OTP -->

                <div
                    class="form-group"
                    id="otpSection"
                    style="display: none;"
                >

                    <label for="visitorOtp">
                        Kode Verifikasi
                    </label>

                    <input
                        type="text"
                        id="visitorOtp"
                        placeholder="Masukkan 4 digit kode"
                        inputmode="numeric"
                        maxlength="4"
                        autocomplete="one-time-code"
                    >

                    <small>
                        Periksa inbox Gmail kamu.
                    </small>

                </div>


                <!-- STATUS -->

                <p
                    id="visitorStatus"
                    style="
                        display: none;
                        margin-top: 12px;
                    "
                ></p>


                <!-- BUTTON -->

                <button
                    type="submit"
                    id="visitorSubmit"
                >
                    Kirim Kode Verifikasi
                </button>


            </form>


        </div>

    </div>


    <!--
        IFRAME UNTUK KOMUNIKASI
        DENGAN GOOGLE APPS SCRIPT
    -->

    <iframe
        name="googleScriptFrame"
        id="googleScriptFrame"
        style="display: none;"
    ></iframe>


    <script src="visitor.js"></script>

</body>

</html>
